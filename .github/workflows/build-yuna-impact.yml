name: Build Yuna ComfyUI Impact Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-yuna-impact.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/adammamuti500/yuna-comfyui-impact

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:2026-06-04-fluxfp8-impact
            ${{ env.IMAGE_NAME }}:latest
          provenance: false
          sbom: false
          no-cache: true

      - name: Disk report
        if: always()
        shell: bash
        run: |
          docker system df || true
          df -h
